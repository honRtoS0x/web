<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>bai_2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Logo, label --> 
     <form action="#">
     <div class="text-center">
        <div class="logo">
            <div class="logo-top">JackSon</div>
            <hr class="logo-hr">
            <div class="logo-bottom">Electronic</div>
        </div>
            <h2 class="text-center">Registration Form</h2>
            </div>
    <!-- bang--> <!-- label-1-2-3  -->
      <p class="sub-heading">Register your Jackson Electronic products here</p>
     <table>
        <tr>
            <td class = "label-1">
                <label for="FirstName">First Name:</label>
            </td>
            <td class = "input-1">
                <input type="text" id="FirstName" name="FirstName" required>
                <label for="LastName" class="label-2">Last Name:</label>
                <input type="text" id="LastName" name="LastName" required>
            </td>
        </tr> 
        <tr>
            <td class = "label-1">
                <label for="Address1">Address#1:</label>
            </td>
            <td class = "input-1">
                <input type="text" id="Address1" name="Address1" required>
            </td>
        </tr>
        <tr>
            <td class = "label-1">
                <label for="Address2">Address2:</label>
            </td>
                <td class = "input-1">
                    <input type="text" id="Address2" name="Address2">
                </td>
        </tr>
        <tr>
            <td class = "label-1">
                <label for="City">City:</label>
            </td>
            <td class = "input-1">
                <input type="text" id="City" name="City" required>
                <label for="State" class="label-2">State:</label>
                <input type="text" id="State" name="State" required>
                <label for="Zip" class="label-2">Zip:</label>
                <input type="text" id="Zip" name="Zip" required>
            </td>
        </tr>
        <tr>
            <td class = "label-1"><label for="Country">Country:</label>
            </td>
            <td class = "input-1">
                <input type="text" id="Country" name="Country" value="United States" required>
            </td>
        </tr>
        <tr>
        <td colspan="2">
            <hr class="line">
        </td>
        </tr>
        <tr class="label-1">
            <td class="label-1">
                <label for="Product">Product:</label>
            </td>
            <td class="input-1">
                <select id="Product" name="Product" required>
                    <option value="ScanMaster">ScanMaster</option>
                    <option value="7 Byte Brew">7 Byte Brew</option>
                    <option value="Pham Minh Hoang">Pham Minh Hoang</option>
                </select>
            </td>
        </tr>
        <tr>
            <td class="label-1">
                <label for="DatePurchased">Date Purchased:</label>
            </td>
            <td class="input-1">
                <input type="text" id="DatePurchased" name="DatePurchased" required>
            </td>
        </tr>
        <tr>
            <td class="label-1">
                <label for="Serial">Serial#:</label>
            </td>
            <td class="input-1">
                <input type="text" id="Serial" name="Serial" required>
            </td>
        </tr>
        <tr>
            <td class="label-1 label-3">Used For:</td>
            <td>
                    <span class="item item-left">
                        <input type="radio" id="home" name="usedFor" value="Home" class="cuscheck">
                        <label for="home" class="radio-label">Home</label>
                    </span>
                    <span class="item">
                        <input type="radio" id="edu" name="usedFor" value="EducationalInstitution"
                            class="cuscheck">
                        <label for="edu" class="radio-label">Educational Institution</label>
                    </span><br>
                    <span class="item item-left">
                        <input type="radio" id="biz" name="usedFor" value="Business" class="cuscheck" checked>
                        <label for="biz" class="radio-label">Business</label>
                    </span>
                    <span class="item">
                        <input type="radio" id="other" name="usedFor" value="Other" class="cuscheck">
                        <label for="other" class="radio-label">Other</label>
                    </span><br>
                    <span class="item item-left">
                        <input type="radio" id="gov" name="usedFor" value="Government" class="cuscheck">
                        <label for="gov" class="radio-label">Government</label>
                    </span>
                </td>
        </tr>
        <tr>
            <td class="label-1 label-3">System (check all that apply):</td>
           
            <td>
                <span class="item item-left">
                    <input type="checkbox" id="Windows" name="system" value="Windows" class="cuscheck">
                    <label for="Windows" class="checkbox-label">Windows</label>
                </span>
                <span class="item">
                    <input type="checkbox" id="Macintosh" name="system" value="Macintosh" class="cuscheck">
                    <label for="Macintosh" class="checkbox-label">Macintosh</label>
                </span><br>
                <span class="item item-left">
                    <input type="checkbox" id="Linux" name="system" value="Linux" class="cuscheck">
                    <label for="Linux" class="checkbox-label">Linux</label>
                </span>
                <span class="item">
                    <input type="checkbox" id="OtherSystem" name="system" value="OtherSystem"
                        class="cuscheck">
                    <label for="OtherSystem" class="checkbox-label">Other</label>
                </span>
            </td>
        </tr>
        <tr>
        <td colspan="2">
            <hr class="line">
        </td>
        </tr>
        <tr>
            <td class=" label-1 label-3">
                <label for="Comments">Comments?:</label>
            </td>
            <td class="input-1">
                <textarea id="Comments" name="Comments" rows="4" cols="50"></textarea>
            </td>
        </tr>
        <tr>
            <td colspan="2" class="btn-row">
                <input type="button" value="Click to register">
                <input type="button" value="Click to cancel">
            </td>
        </tr>
    </table>
</form>
</body>
</html>
